[workspace]
resolver = "3"
members = ["crates/nazz-core", "crates/nazz-runtime", "crates/nazz-storage", "crates/nazz-sandbox"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95.0"
license = "Apache-2.0"
license-file = "LICENSE"
publish = ["crates-io"]
repository = "https://github.com/open-ai-sdk/nazz-core"
readme = "README.md"

[workspace.dependencies]
nazz-core = { version = "=0.1.0", path = "crates/nazz-core" }
nazz-storage = { version = "=0.1.0", path = "crates/nazz-storage" }
nazz-runtime = { version = "=0.1.0", path = "crates/nazz-runtime" }
nazz-sandbox = { version = "=0.1.0", path = "crates/nazz-sandbox" }
rig = { version = "=0.44.0", default-features = false, features = ["agent", "image"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
sha2 = "0.10"
hex = "0.4"
uuid = { version = "1", features = ["v4", "serde"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "io-util", "net", "time", "sync", "fs", "signal"] }

[workspace.lints.rust]
unsafe_code = "forbid"
