[workspace]
resolver = "3"
members = ["crates/agent-core", "crates/agent-runtime", "crates/agent-storage", "crates/agent-sandbox"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95.0"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
agent-core = { path = "crates/agent-core" }
agent-storage = { path = "crates/agent-storage" }
agent-runtime = { path = "crates/agent-runtime" }
agent-sandbox = { path = "crates/agent-sandbox" }
rig = { version = "=0.44.0", default-features = false, features = ["agent", "image"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
sha2 = "0.10"
hex = "0.4"
uuid = { version = "1", features = ["v4", "serde"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "io-util", "net", "time", "sync", "fs", "signal"] }

[workspace.lints.rust]
unsafe_code = "forbid"
